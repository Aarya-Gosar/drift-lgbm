[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-lgbm"
version = "0.1.0"
description = "partial_fit for LightGBM: incremental training on new data with drift detection, stale-tree removal, and correlation-aware (clustered) feature importance."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "lightgbm>=4.0",
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
]
keywords = [
    "lightgbm", "lgbm", "partial_fit", "incremental learning", "online learning", "continued training",
    "init_model", "gradient boosting", "concept drift", "data drift", "walk-forward", "feature importance",
    "clustered feature importance", "correlated features", "feature selection", "quantitative finance",
    "algorithmic trading", "time series",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["drift_lgbm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # LightGBM's sklearn wrapper asks joblib for the physical core count; on some
    # Windows machines joblib cannot determine it and warns. Environmental noise.
    "ignore:Could not find the number of physical cores:UserWarning",
]
